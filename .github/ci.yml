name: AeroMetrics CI/CD Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python-api:
    runs-on: ubuntu-latest
    
    # Diz para o GitHub rodar os comandos dentro da pasta backend
    defaults:
      run:
        working-directory: ./backend 

    steps:
    # 1. Baixa o código do seu repositório
    - name: Checkout do código
      uses: actions/checkout@v3

    # 2. Prepara o ambiente Python
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Instala as dependências do requirements.txt
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Cria o Banco de Dados limpo para os testes usando o seu script!
    - name: Gerar Banco de Dados de Teste
      run: python setup_db.py

    # 5. Roda os testes automatizados
    - name: Rodar Testes da API
      run: pytest